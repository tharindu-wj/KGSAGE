[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgsage"
version = "0.1.0"
description = "Knowledge Graph Semantic Anomaly Generator - learned, neighbourhood-aware KG corruptions"
readme = "README.md"
requires-python = ">=3.10"

# Deliberately UNPINNED. On a cluster torch and torch-geometric are already
# installed against the node's CUDA build; pip sees them satisfied and leaves
# them alone. Pinning versions here would let a `pip install -e .` silently
# replace a CUDA wheel with a CPU one.
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "torch-geometric",
]

[project.optional-dependencies]
# Only kgsage/cli/ego_from_csv.py needs these. A detector integrating KGSAGE
# through the public API never draws ego graphs, so it can skip them.
viz = ["networkx", "matplotlib"]

[tool.setuptools.packages.find]
# Package code lives under kgsage/. Everything beside it -- data/, outputs/,
# slurm/, smoke_test.py -- is repo furniture and is not installed.
include = ["kgsage*"]
